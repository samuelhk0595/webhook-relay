services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PUBLIC_URL: https://${DOMAIN:?Set DOMAIN in .env}
      BOOTSTRAP_USERNAME: ${BOOTSTRAP_USERNAME:-admin}
      BOOTSTRAP_PASSWORD_FILE: /run/secrets/bootstrap_password
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-10485760}
      MAX_HEADER_BYTES: ${MAX_HEADER_BYTES:-65536}
      INGRESS_CONCURRENCY: ${INGRESS_CONCURRENCY:-64}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-16}
      DESTINATION_CONCURRENCY: ${DESTINATION_CONCURRENCY:-2}
      RETENTION_DAYS: ${RETENTION_DAYS:-7}
      FAILED_RETENTION_DAYS: ${FAILED_RETENTION_DAYS:-30}
    secrets:
      - bootstrap_password
    volumes:
      - relay_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    stop_grace_period: 40s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      CADDY_EMAIL: ${CADDY_EMAIL:?Set CADDY_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

secrets:
  bootstrap_password:
    file: ./secrets/bootstrap_password.txt

volumes:
  relay_data:
  caddy_data:
  caddy_config:
